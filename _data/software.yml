# One entry per piece of software: a toolbox, a package, a code release.
# Only name and description are required.
#
#   kind      what it is, e.g. "MATLAB toolbox", "Julia package"
#   status    e.g. "alpha", "beta", "version 1.2"  (leave out once it is stable)
#   year      year of the first release
#   selected  true to also show it on the home page
#   links     any number of links, each with a label and a URL
#   paper, slides, video   as for papers and talks
#
# The entry below is an example: replace it with your own.

- name: Neuromorphic Control Toolbox
  kind: MATLAB® and Simulink® toolbox
  status: alpha v0.3.1
  year: 2025
  selected: true
  description: Designed to build and analyse control system using neuromorphic components and principles.
  links:
    - label: Documentation
      url: https://neuromorphic-control-toolbox.readthedocs.io/latest/
    - label: GitHub
      url: https://github.com/ChristianFernandezLorden/NeuromorphicControlToolbox
    - label: File Exchange
      url: https://www.mathworks.com/matlabcentral/fileexchange/180432-neuromorphic-control-toolbox
