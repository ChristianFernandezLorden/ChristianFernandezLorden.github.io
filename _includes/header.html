<header class="site-header wrap">
  <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav aria-label="Main">
    <ul>
      {% for item in site.data.nav -%}
      <li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% elsif page.url contains item.url %} aria-current="true"{% endif %}>{{ item.title }}</a></li>
      {% endfor %}
    </ul>
  </nav>
</header>
